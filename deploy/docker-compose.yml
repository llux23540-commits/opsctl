# Local / single-host deployment.
#   cp deploy/.env.example deploy/.env      # then edit the secrets
#   sh deploy/gen-certs.sh                   # self-signed cert (or drop real certs)
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# The opsctl app is NOT exposed to the host — only the nginx edge is, and it
# terminates TLS. All client traffic is HTTPS; opsctl<->nginx stays plain HTTP
# inside the compose network (trust boundary).
services:
  opsctl:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opsctl-server:latest
    expose:
      - "8443"          # internal only (was ports 8443:8443 — plain HTTP to host)
    environment:
      OPSCTL_SERVER__BIND: 0.0.0.0:8443
      OPSCTL_STORE__URL: sqlite://data/opsctl.db?mode=rwc
      OPSCTL_DEV__SEED: "false"
      OPSCTL_AUTH__JWT_SECRET: ${OPSCTL_AUTH__JWT_SECRET:?set in .env}
      OPSCTL_VAULT__PASSPHRASE: ${OPSCTL_VAULT__PASSPHRASE:?set in .env}
      OPSCTL_BOOTSTRAP__ADMIN_PASSWORD: ${OPSCTL_BOOTSTRAP__ADMIN_PASSWORD:-admin}
    env_file:
      - .env
    volumes:
      - opsctl-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8443/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"      # redirects to 443
      - "443:443"    # TLS termination
    depends_on:
      - opsctl
    restart: unless-stopped

volumes:
  opsctl-data:
