# opsctl reverse proxy (edge). TLS terminates HERE; upstream opsctl stays plain
# HTTP inside the trust boundary. Clients only ever speak HTTPS, so login
# passwords / OTP / SSH·SQL commands / approval reasons are never sent in clear.
# Certs: run deploy/gen-certs.sh (self-signed, dev/internal) or drop real certs at
# deploy/certs/{fullchain.pem,privkey.pem}.
events {}
http {
  upstream opsctl_app { server opsctl:8443; }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # 80: health + ACME, everything else redirects to 443
  server {
    listen 80;
    server_name _;
    location /healthz { return 200 'ok'; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # 443: TLS termination -> plain upstream inside trust boundary
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 16m;

    location / {
      proxy_pass http://opsctl_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
